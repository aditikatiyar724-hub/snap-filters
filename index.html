<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <title>Snap Filters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <!-- Camera screen -->
    <section class="screen camera" id="cameraScreen">
      <div class="stage" id="stage">
        <canvas id="preview"></canvas>
        <div class="flash" id="flash"></div>
      </div>

      <button class="gallery-btn" id="openGallery" aria-label="Open gallery">
        <img src="assets/icons/gallery.svg" alt="" />
      </button>

      <div class="bottom-fade"></div>

      <div class="carousel-wrap">
        <div class="carousel" id="carousel" role="listbox" aria-label="Filters"></div>
        <div class="shutter-ring" aria-hidden="true"></div>
        <svg class="rec-progress" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" pathLength="100" /></svg>
      </div>

      <div class="intensity" id="intensity">
        <input type="range" id="intensityRange" min="0" max="100" step="1" value="100" aria-label="Filter intensity" />
        <span id="intensityValue">100%</span>
      </div>

      <div class="rec-timer" id="recTimer" hidden><span class="rec-dot"></span><span id="recTime">0:00</span></div>

      <div class="notice" id="notice" hidden>
        <p id="noticeText">Allow camera access to use filters.</p>
        <div class="notice-actions">
          <button class="pill" id="retryCamera">Try again</button>
          <label class="pill pill-light">
            Upload a photo
            <input type="file" accept="image/*" id="uploadInput" hidden />
          </label>
        </div>
      </div>
    </section>

    <!-- Gallery screen -->
    <section class="screen gallery" id="galleryScreen" hidden>
      <header class="topbar">
        <button class="back" id="closeGallery" aria-label="Back to camera">
          <img src="assets/icons/back.svg" alt="" />
          <span>gallery</span>
        </button>
      </header>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>No snaps yet. Tap the ring to take a photo, or hold it to record a video.</p>
    </section>

    <!-- Photo viewer -->
    <section class="screen viewer" id="viewer" hidden>
      <header class="topbar">
        <button class="back" id="closeViewer" aria-label="Back to gallery">
          <img src="assets/icons/back.svg" alt="" />
          <span id="viewerTitle">snap</span>
        </button>
      </header>
      <img class="viewer-img" id="viewerImg" alt="" />
      <video class="viewer-img" id="viewerVideo" controls playsinline loop hidden></video>
      <div class="viewer-actions">
        <button class="pill pill-light" id="saveSnap">Download</button>
        <button class="pill" id="shareSnap" hidden>Share</button>
        <button class="pill pill-danger" id="deleteSnap">Delete</button>
      </div>
    </section>
  </main>

  <script src="js/filters.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
